# training/config.yaml
# CogVideoX-2B — optimized for T4 12GB Colab

# ── Paths ──────────────────────────────────────────────────────────────────
pretrained_model : "THUDM/CogVideoX-2b"
wav2vec2_model   : "facebook/wav2vec2-base"
data_root        : ".../DATASET"
output_dir       : "../checkpoints"
resume_from      : null

# ── Training ───────────────────────────────────────────────────────────────
total_iters  : 1000
batch_size   : 1          # T4 12GB — MUST be 1
clip_frames  : 6          # reduced from 24 — saves ~4× attention memory
num_workers  : 2          # Colab can handle 2
lr           : 0.0001
save_every   : 100
log_every    : 1

# ── PhD Loss weights (from paper) ──────────────────────────────────────────
lambda_pose   : 0.1
lambda_detail : 0.1
lambda_low    : 0.1

# ── Memory optimizations (critical for T4 12GB) ───────────────────────────
aux_loss_prob      : 0.25     # only compute PhD auxiliary loss 25% of iters
warmup_no_aux      : 500      # first 500 iters: MSE only, no VAE decode

#python training/train.py --config training/config.yaml